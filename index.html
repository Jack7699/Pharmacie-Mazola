<style>
:root{
  --bg:#040b08;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.1);
  --ink:#eafff5;--muted:#8fb0a2;--mint:#34f5a8;--cyan:#27d3ff;--red:#ff6b6b;
  --grad:linear-gradient(120deg,var(--mint),var(--cyan));
  --radius:28px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.disp{font-family:"Space Grotesk","Plus Jakarta Sans",sans-serif}
em{font-style:normal}

/* scroll progress */
#sp{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;background:var(--grad);transform-origin:left;transform:scaleX(0);box-shadow:0 0 14px var(--mint)}
[dir=rtl] #sp{transform-origin:right}

/* background */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--bg)}
.bg i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:620px;height:620px;background:#0b8f62;top:-200px;left:-160px}
.bg i:nth-child(2){width:560px;height:560px;background:#0b6f99;top:20%;right:-200px;animation-delay:-8s}
.bg i:nth-child(3){width:520px;height:520px;background:#0a7a55;bottom:-220px;left:20%;animation-delay:-14s}
@keyframes drift{to{transform:translate(80px,60px) scale(1.15)}}
.gridbg{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(70% 60% at 50% 25%,#000,transparent);-webkit-mask-image:radial-gradient(70% 60% at 50% 25%,#000,transparent)}
.cursor{position:fixed;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(52,245,168,.14),transparent 65%);pointer-events:none;transform:translate(-50%,-50%);z-index:-1;left:-999px;top:-999px}

/* nav */
.nav{position:sticky;top:14px;z-index:50;padding:0 20px;max-width:1160px;margin:14px auto 0}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 18px;border-radius:999px;background:rgba(10,22,17,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line)}
[dir=rtl] .nav-in{padding:10px 18px 10px 10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:1.05rem}
.mark{width:30px;height:30px;border-radius:10px;background:var(--grad);position:relative;box-shadow:0 0 24px rgba(52,245,168,.5);flex:none}
.mark:before,.mark:after{content:"";position:absolute;background:#04251a;border-radius:2px}
.mark:before{left:13px;top:6px;width:4px;height:18px}
.mark:after{left:6px;top:13px;width:18px;height:4px}
.links{display:flex;gap:26px;font-size:.92rem;font-weight:500;color:var(--muted)}
.links a{transition:color .2s}.links a:hover{color:var(--ink)}
.navr{display:flex;align-items:center;gap:8px}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 24px;border-radius:999px;font-weight:700;font-size:.95rem;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;transition:transform .25s,box-shadow .25s,background .25s;will-change:transform}
.btn:hover{background:var(--panel2)}
.btn.go{background:var(--grad);color:#03281b;border:none;box-shadow:0 16px 40px -10px rgba(52,245,168,.5)}
.btn.go:hover{box-shadow:0 0 0 6px rgba(52,245,168,.15),0 20px 50px -8px rgba(52,245,168,.7)}
.btn.big{padding:18px 32px;font-size:1.05rem}
.btn.sm{padding:10px 18px;font-size:.88rem}

/* hero */
.hero{position:relative;padding:92px 0 40px;text-align:center}
.pillbar{display:inline-flex;align-items:center;gap:12px;padding:8px 18px 8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);font-size:.86rem;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:#777;flex:none}
.dot.on{background:var(--mint);animation:ping 2s infinite}
.dot.off{background:var(--red)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,245,168,.7)}80%,100%{box-shadow:0 0 0 12px rgba(52,245,168,0)}}
.sep{width:1px;height:14px;background:var(--line)}
#clock{font-variant-numeric:tabular-nums;color:var(--muted);direction:ltr}
.nextline{margin-top:14px;color:var(--muted);font-size:.95rem;min-height:1.5em}
h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(3.2rem,12.5vw,9.6rem);letter-spacing:-.06em;line-height:.88;margin:26px 0 0}
h1 .ln{display:block;overflow:hidden;padding:.04em .02em}
h1 .ch{display:inline-block;transform:translateY(110%);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
h1 .g .ch{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes rise{to{transform:none}}
.lead{max-width:560px;margin:28px auto 36px;color:var(--muted);font-size:1.18rem}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.chip{padding:8px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.85rem;font-weight:600;color:var(--muted)}
.chip b{color:var(--ink)}

.ecg{position:relative;margin:48px auto 0;max-width:900px;height:90px}
.ecg svg{width:100%;height:100%;overflow:visible}
.ecg path{fill:none;stroke:var(--mint);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(52,245,168,.9));stroke-dasharray:1400;stroke-dashoffset:1400;animation:beat 3.6s linear infinite}
.ecg path.ghost{stroke:rgba(255,255,255,.07);filter:none;animation:none;stroke-dasharray:none}
@keyframes beat{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}

.caps{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cap{position:absolute;width:74px;height:28px;border-radius:999px;background:linear-gradient(90deg,var(--mint) 50%,#fff 50%);opacity:.9;box-shadow:0 12px 40px rgba(52,245,168,.35);animation:flt 9s ease-in-out infinite}
.cap:after{content:"";position:absolute;left:8px;right:8px;top:5px;height:5px;border-radius:99px;background:rgba(255,255,255,.55)}
.cap.c1{left:6%;top:24%;transform:rotate(-28deg)}
.cap.c2{right:7%;top:18%;transform:rotate(35deg);width:58px;height:22px;animation-delay:-3s;background:linear-gradient(90deg,var(--cyan) 50%,#fff 50%)}
.cap.c3{left:12%;bottom:12%;transform:rotate(18deg);width:50px;height:20px;animation-delay:-5s;opacity:.6}
.cap.c4{right:11%;bottom:20%;transform:rotate(-14deg);animation-delay:-7s;opacity:.7}
@keyframes flt{50%{translate:0 -22px}}

.marq{margin:48px 0 0;border-block:1px solid var(--line);background:rgba(255,255,255,.02);overflow:hidden;white-space:nowrap;direction:ltr}
.marq .t{display:inline-flex;gap:44px;padding:16px 0;animation:mq 34s linear infinite;font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.marq .t span{display:inline-flex;align-items:center;gap:44px}
.marq .t span:after{content:"✚";color:var(--mint)}
@keyframes mq{to{transform:translateX(-50%)}}

/* sections */
.shead{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:88px 0 28px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}
h2{font-family:"Space Grotesk",sans-serif;font-size:clamp(2rem,5.5vw,3.6rem);letter-spacing:-.04em;line-height:1.02;margin-top:10px}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:30px;overflow:hidden;transform-style:preserve-3d;backdrop-filter:blur(8px)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(52,245,168,.16),transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{border-color:rgba(52,245,168,.4)}
.card:hover:before{opacity:1}
.k{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3{font-family:"Space Grotesk",sans-serif;font-size:1.7rem;letter-spacing:-.03em;line-height:1.15}
.card p{color:var(--muted);margin-top:10px;font-size:.95rem}
.c-addr{grid-column:span 5}
.c-tel{grid-column:span 7;background:var(--grad);color:#03281b;border:none;display:flex;flex-direction:column;justify-content:space-between;min-height:230px}
.c-tel .k,.c-tel p{color:rgba(3,40,27,.7)}
.c-tel h3{font-size:clamp(2.2rem,6vw,4rem);letter-spacing:-.05em;direction:ltr;unicode-bidi:isolate;text-align:start}
[dir=rtl] .c-tel h3{text-align:right}
.c-tel:before{background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.35),transparent 55%)}
.c-tel .arrow{position:absolute;inset-inline-end:26px;top:26px;width:52px;height:52px;border-radius:50%;background:#03281b;color:var(--mint);display:grid;place-items:center;font-size:1.3rem;transition:transform .3s}
.c-tel:hover .arrow{transform:rotate(45deg) scale(1.1)}
.c-hours{grid-column:span 7}
.c-rate{grid-column:span 5;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.score{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(5rem,13vw,8.5rem);letter-spacing:-.07em;line-height:.85;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stars{position:relative;display:inline-block;font-size:1.6rem;letter-spacing:4px;color:rgba(255,255,255,.15);direction:ltr}
.stars b{position:absolute;left:0;top:0;width:0;overflow:hidden;color:#ffc53d;white-space:nowrap;font-weight:400;transition:width 1.6s cubic-bezier(.2,.8,.2,1) .3s}
.stars.go b{width:80%}

.hours{list-style:none;padding:0;margin:8px 0 0}
.hours li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;margin:0 -16px;border-radius:16px;border:1px solid transparent;transition:background .3s}
.hours li>span{font-weight:600}
.hours li b{font-family:"Space Grotesk",sans-serif;font-weight:600;text-align:end;line-height:1.35;font-size:1.05rem}
.hours li.off b{color:var(--muted)}
.hours li.today{background:rgba(52,245,168,.1);border-color:rgba(52,245,168,.35)}
.tb{display:none;margin-inline-start:10px;font-size:.66rem;letter-spacing:.12em;padding:3px 8px;border-radius:99px;background:var(--mint);color:#03281b;font-weight:800;vertical-align:middle}
.hours li.today .tb{display:inline-block}
.tl{margin-top:22px}
.tl .bar{position:relative;height:14px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;direction:ltr}
.tl .seg{position:absolute;top:0;bottom:0;background:var(--grad);border-radius:99px;opacity:.9}
.tl .now{position:absolute;top:0;width:3px;height:14px;border-radius:3px;background:#fff;box-shadow:0 0 14px #fff;transform:translateX(-50%)}
.tl .lab{display:flex;justify-content:space-between;margin-top:8px;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
.tl .cap2{font-size:.82rem;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}

/* team */
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.member{padding:34px 30px}
.member h3{font-size:1.35rem}
.av{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;margin-bottom:26px;background:radial-gradient(circle at 30% 25%,rgba(52,245,168,.35),rgba(39,211,255,.12));border:1px solid rgba(52,245,168,.35)}
.av .ring{position:absolute;inset:-8px;border-radius:50%;border:1px dashed rgba(52,245,168,.4);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lead-m{background:linear-gradient(160deg,rgba(52,245,168,.14),rgba(39,211,255,.06)),var(--panel);border-color:rgba(52,245,168,.35)}
.lead-m .k{color:var(--mint)}
.supply{display:flex;align-items:center;gap:24px;margin-top:16px;padding:28px 30px}
.supply-ic{flex:none;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:1.8rem;background:rgba(39,211,255,.12);border:1px solid rgba(39,211,255,.35)}
.supply h3{font-size:1.4rem}
.gpm{margin-inline-start:auto;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(2rem,5vw,3.2rem);letter-spacing:.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* garde */
.garde{position:relative;border-radius:40px;padding:clamp(28px,5vw,60px);overflow:hidden;border:1px solid rgba(52,245,168,.3);background:radial-gradient(120% 140% at 100% 0%,rgba(52,245,168,.22),transparent 55%),radial-gradient(100% 120% at 0% 100%,rgba(39,211,255,.18),transparent 55%),rgba(255,255,255,.03)}
.garde .moon{position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#bffbe3 40%,transparent 70%);opacity:.12}
.tagg{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(52,245,168,.14);border:1px solid rgba(52,245,168,.4);color:var(--mint);font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.garde h2{font-size:clamp(2.4rem,7vw,5rem);margin-top:18px}
.garde .sub{color:var(--muted);max-width:420px;margin-top:14px}
.ghead{position:relative;display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.big8{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.04em;text-align:end;line-height:1}
.big8 small{display:block;font-family:"Plus Jakarta Sans",sans-serif;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.days{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.day{border-radius:24px;padding:20px 10px 18px;text-align:center;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:transform .3s,background .3s}
.day:hover{transform:translateY(-6px);background:rgba(255,255,255,.09)}
.day .w{font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.day .n{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(2.2rem,4vw,3.2rem);letter-spacing:-.05em;line-height:1;margin:8px 0 10px}
.day .h{font-size:.8rem;color:var(--muted);line-height:1.3}
.day.today{background:var(--grad);color:#03281b;border:none;transform:translateY(-10px) scale(1.04);box-shadow:0 24px 60px -12px rgba(52,245,168,.6)}
.day.today .w,.day.today .h{color:rgba(3,40,27,.75)}
.day.past{opacity:.4}
.prog{position:relative;margin-top:34px;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.prog i{position:absolute;inset-inline-start:0;top:0;bottom:0;width:0;background:var(--grad);border-radius:99px;transition:width 1.6s cubic-bezier(.2,.8,.2,1) .2s;box-shadow:0 0 20px rgba(52,245,168,.8)}
.gfoot{position:relative;margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.95rem}
.gfoot strong{color:var(--ink)}

/* map */
.mapbox{display:grid;grid-template-columns:5fr 7fr;gap:16px}
.mapcard{display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:clamp(26px,4vw,40px)}
.mapcard h3{font-size:clamp(2rem,4.5vw,3.2rem);letter-spacing:-.04em;line-height:1.02}
.mapbtns{display:flex;gap:10px;flex-wrap:wrap}
.frame{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);min-height:340px;background:var(--panel)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:invert(92%) hue-rotate(155deg) saturate(.7) brightness(.95) contrast(.95)}

/* faq */
.faq{display:grid;gap:12px}
.faq details{border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:0 26px;transition:border-color .3s,background .3s}
.faq details[open]{border-color:rgba(52,245,168,.4);background:rgba(52,245,168,.05)}
.faq summary{list-style:none;cursor:pointer;padding:22px 0;font-weight:700;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--mint);font-size:1.3rem;transition:transform .3s}
.faq details[open] summary:after{transform:rotate(45deg)}
.faq .a{padding:0 0 24px;color:var(--muted);max-width:640px}

footer{padding:64px 0 120px;text-align:center;color:var(--muted);font-size:.88rem}
.callbar{display:none}

/* reveal */
.rv{opacity:0;transform:translateY(36px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.in.done{transition:transform .25s ease,border-color .3s,background .3s;transition-delay:0s!important}

/* RTL / arabic */
[dir=rtl] body{font-family:"Cairo","Plus Jakarta Sans",sans-serif}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .k,[dir=rtl] .eyebrow,[dir=rtl] .tagg,[dir=rtl] .big8,[dir=rtl] .big8 small,[dir=rtl] .marq .t,[dir=rtl] .day .w,[dir=rtl] .hours li b,[dir=rtl] .tb{font-family:"Cairo",sans-serif;letter-spacing:0;text-transform:none}
[dir=rtl] h1{line-height:1.12}
[dir=rtl] h1 .ln{padding:.1em .04em}
[dir=rtl] .card h3,[dir=rtl] h2{line-height:1.3}

@media(max-width:900px){
  .c-addr,.c-tel,.c-hours,.c-rate{grid-column:span 12}
  .team{grid-template-columns:1fr}
  .days{grid-template-columns:repeat(4,1fr)}
  .day.today{transform:none}
  .mapbox{grid-template-columns:1fr}
}
@media(max-width:760px){
  .links{display:none}
  .hero{padding:60px 0 20px}
  .cap.c3,.cap.c4{display:none}
  .days{grid-template-columns:repeat(2,1fr)}
  .shead{margin-top:64px}
  .supply{flex-wrap:wrap}
  .gpm{margin-inline-start:0}
  .callbar{display:flex;position:fixed;left:14px;right:14px;bottom:14px;z-index:60}
  .callbar a{flex:1;text-align:center;padding:17px;border-radius:999px;font-weight:800;color:#03281b;background:var(--grad);box-shadow:0 16px 40px -6px rgba(52,245,168,.6)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  h1 .ch{transform:none}.rv{opacity:1;transform:none}.ecg path{stroke-dashoffset:0}
}
</style>
</head>
<body>
<div id="sp"></div>
<div class="bg"><i></i><i></i><i></i></div>
<div class="gridbg"></div>
<div class="cursor" id="cursor"></div>

<div class="nav">
  <div class="nav-in">

  }
  function renderNote(){
    var tt=now(),off=gOff(tt.utc),n=$('#gardeNote'),l=L();
    if(off<0){n.innerHTML=l.n_before(-off);pct=0}
    else if(off<=6){n.innerHTML=l.n_in;pct=((off+(tt.h*60+tt.mi)/1440)/7)*100}
    else{n.textContent=l.n_after;pct=100}
    if($('#garde').classList.contains('in'))$('#prog').style.width=pct+'%';
  }
  function drawBar(tt,sl,mins,inG){
    var bar=$('#bar');bar.innerHTML='';
    sl.forEach(function(r){var s=document.createElement('div');s.className='seg';s.style.left=(r[0]/14.4)+'%';s.style.width=((r[1]-r[0])/14.4)+'%';bar.appendChild(s)});
    var n=document.createElement('div');n.className='now';n.style.left=(mins/14.4)+'%';bar.appendChild(n);
    var open=sl.some(function(r){return mins>=r[0]&&mins<r[1]}),l=L();
    $('#tlcap').textContent=l.tl_today+(inG?l.tl_garde:'');
    var st=$('#tlstate');st.textContent=sl.length?(open?l.tl_open:l.tl_closed):l.tl_closedday;st.style.color=open?'var(--mint)':'var(--red)';
  }
  var lastKey='';
  function tick(){
    var tt=now(),l=L(),mins=tt.h*60+tt.mi,off=gOff(tt.utc),inG=off>=0&&off<=6,sl=slots(tt.day,inG);
    $('#clock').textContent=pad(tt.h)+':'+pad(tt.mi)+':'+pad(tt.s);
    var cur=null;sl.forEach(function(r){if(mins>=r[0]&&mins<r[1])cur=r});
    var open=!!cur;
    $('#status').textContent=(open?l.open_now:l.closed_now)+(inG?l.guard_s:'');
    $('#dot').className='dot '+(open?'on':'off');
    var nl='';
    if(open){nl=l.close_at(ft(cur[1]))}
    else{var no=nextOpen(tt,mins);if(no){nl=no.d===0?l.open_today(ft(no.start)):no.d===1?l.open_tom(ft(no.start)):l.open_day(l.dnf[no.dow],ft(no.start))}}
    $('#nextline').textContent=nl;
    var key=lang+'|'+mins+'|'+inG;
    if(key!==lastKey){
      lastKey=key;drawBar(tt,sl,mins,inG);
      document.querySelectorAll('.hours li').forEach(function(li){
        li.classList.toggle('today',!inG&&li.dataset.d.split(',').indexOf(String(tt.day))>-1);
      });
    }
  }
  function renderAll(){renderStatic();renderTitle();renderMarq();renderDays();renderNote();lastKey='';tick()}
  renderAll();setInterval(tick,1000);
  setInterval(function(){renderNote()},60000);

  /* ================= Interactions ================= */
  $('#langbtn').addEventListener('click',function(){
    lang=lang==='fr'?'ar':'fr';try{localStorage.setItem('mazola-lang',lang)}catch(e){}
    renderAll();
  });
  var addr='Pharmacie Mazola, Rue 4, Casablanca 20250';
  $('#copybtn').addEventListener('click',function(){
    var b=this;
    function ok(){b.innerHTML=L().copied;setTimeout(function(){b.innerHTML=L().copy},1800)}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(addr).then(ok,function(){})}
  });
  $('#sharebtn').addEventListener('click',function(){
    var b=this;
    if(navigator.share){navigator.share({title:'Pharmacie Mazola',text:addr+' · 05 22 93 36 89',url:location.href.split('#')[0]}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(addr).then(function(){b.innerHTML=L().copied;setTimeout(function(){b.innerHTML=L().share},1800)},function(){})}
  });
  window.addEventListener('scroll',function(){
    var h=document.documentElement,r=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
    $('#sp').style.transform='scaleX('+Math.min(1,Math.max(0,r))+')';
  },{passive:true});

  /* apparition au scroll */
  var counted=false;
  function countUp(){
    if(counted)return;counted=true;
    var el=$('#score'),t0=performance.now();
    (function f(n){var p=Math.min(1,(n-t0)/1400),e=1-Math.pow(1-p,3);el.textContent=(4*e).toFixed(1).replace('.',',');if(p<1)requestAnimationFrame(f)})(t0);
  }
  function onIn(e){
    e.classList.add('in');
    setTimeout(function(){e.classList.add('done')},1300);
    if(e.id==='garde')setTimeout(function(){$('#prog').style.width=pct+'%'},200);
    if(e.querySelector&&e.querySelector('#stars'))setTimeout(function(){$('#stars').classList.add('go')},200);
    if(e.querySelector&&e.querySelector('#score'))countUp();
  }
  var els=document.querySelectorAll('.rv');
  if('IntersectionObserver' in window&&!reduce){
    var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){onIn(x.target);io.unobserve(x.target)}})},{threshold:.12});
    els.forEach(function(el,i){el.style.transitionDelay=(i%3)*90+'ms';io.observe(el)});
  }else{els.forEach(onIn)}

  if(!fine||reduce)return;

  var cur=$('#cursor');
  window.addEventListener('pointermove',function(e){cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'});

  document.querySelectorAll('.card').forEach(function(c){
    c.addEventListener('pointermove',function(e){
      var r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
      c.style.setProperty('--mx',x+'px');c.style.setProperty('--my',y+'px');
      if(c.classList.contains('tilt')&&c.classList.contains('done')){
        var rx=((y/r.height)-.5)*-5,ry=((x/r.width)-.5)*5;
        c.style.transform='perspective(900px) rotateX('+rx+'deg) rotateY('+ry+'deg) translateY(-3px)';
      }
    });
    c.addEventListener('pointerleave',function(){c.style.transform=''});
  });
  document.querySelectorAll('.mag').forEach(function(b){
    b.addEventListener('pointermove',function(e){
      var r=b.getBoundingClientRect();
      b.style.transform='translate('+((e.clientX-r.left-r.width/2)*.2)+'px,'+((e.clientY-r.top-r.height/2)*.3)+'px)';
    });
    b.addEventListener('pointerleave',function(){b.style.transform=''});
  });
})();
</script>
</body>
</html>
